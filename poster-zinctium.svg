  <rect x="300" y="760" width="34" height="12" fill="#3A3F45"/>
  <rect x="300" y="700" width="34" height="12" fill="#3A3F45"/>
  <!-- masking line between painted and primer -->
  <rect x="706" y="374" width="8" height="498" fill="#D9A521" opacity=".9"/>
</g>

<!-- ================= LADDER ================= -->
<g stroke="#7A7264" stroke-width="13" stroke-linecap="round" fill="none">
  <line x1="146" y1="946" x2="206" y2="430"/>
  <line x1="226" y1="946" x2="286" y2="430"/>
</g>
<g stroke="#8A8378" stroke-width="10" stroke-linecap="round">
