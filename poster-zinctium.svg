  <path d="M392,534 L400,516" fill="none" stroke="#9AA0A6" stroke-width="7" stroke-linecap="round"/>
  <rect x="396" y="480" width="28" height="86" rx="14" fill="#238049"/>
  <rect x="396" y="480" width="10" height="86" rx="5" fill="#38A868"/>
</g>

