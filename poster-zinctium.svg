  <polygon points="326,472 352,406 452,398 452,472" fill="#7FA8BC"/>
  <polygon points="326,472 352,406 372,404 342,472" fill="#9CC0D0"/>
  <!-- side window -->
  <rect x="472" y="398" width="164" height="74" fill="#7FA8BC"/>
  <rect x="472" y="398" width="46" height="74" fill="#9CC0D0"/>
  <!-- door -->
  <rect x="466" y="486" width="220" height="304" fill="#1D6B3F"/>
  <rect x="472" y="492" width="208" height="292" fill="#238049"/>
  <rect x="596" y="596" width="56" height="13" rx="6" fill="#E6E3DA"/>
  <!-- mirror -->
  <rect x="308" y="404" width="9" height="70" fill="#3A3F45"/>
  <rect x="288" y="396" width="26" height="46" rx="4" fill="#3A3F45"/>
  <!-- wheel arch + wheel -->
  <circle cx="560" cy="872" r="104" fill="#DAD6CA"/>
  <circle cx="560" cy="880" r="92" fill="#14181D"/>
  <circle cx="560" cy="880" r="50" fill="#9AA0A6"/>
  <circle cx="560" cy="880" r="18" fill="#6B6357"/>
  <g fill="#6B6357">
