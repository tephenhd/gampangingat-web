  <circle cx="206" cy="446" r="5.5" fill="#A8703F"/>
  <path d="M194,432 C196,414 211,406 227,408 C241,410 249,420 249,432 Z" fill="#1D6B3F"/>
  <path d="M247,426 L272,429 L272,437 L247,437 Z" fill="#175A34"/>
  <path d="M224,440 C240,438 250,444 250,452 C250,461 240,467 224,464 Z" fill="#DCD8CD"/>
