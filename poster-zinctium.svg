  <!-- torso -->
  <polygon points="188,478 254,478 262,610 182,610" fill="#16356E"/>
  <polygon points="204,480 242,480 248,610 200,610" fill="#1E4A96" opacity=".5"/>
  <rect x="184" y="584" width="76" height="12" fill="#0F2450"/>
  <rect x="192" y="512" width="22" height="20" fill="#0F2450" opacity=".6"/>
  <rect x="186" y="472" width="70" height="13" rx="6" fill="#1E4A96"/>
  <rect x="210" y="454" width="22" height="20" fill="#A8703F"/>
