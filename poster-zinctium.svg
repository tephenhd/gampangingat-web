<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-label="Ilustrasi karoseri: pekerja mengecat bodi truk dengan cat sintetik Zinctium">
<defs>
  <pattern id="zn-dot" width="13" height="13" patternUnits="userSpaceOnUse">
    <circle cx="6.5" cy="6.5" r="1.5" fill="#16356E"/>
  </pattern>
  <filter id="zn-grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
</defs>

<rect width="900" height="1200" fill="#E6E3DA"/>
<rect x="0" y="0" width="900" height="940" fill="#DAD6CA"/>
<rect x="640" y="0" width="260" height="940" fill="url(#zn-dot)" opacity=".2"/>
<g style="mix-blend-mode:multiply">
  <polygon points="0,0 300,0 0,420" fill="#1D6B3F" opacity=".14"/>
  <polygon points="900,0 900,240 700,0" fill="#16356E" opacity=".12"/>
</g>

<!-- roof truss -->
<g fill="#B9B3A4">
  <rect x="0" y="96" width="900" height="10"/>
  <polygon points="120,106 132,106 220,196 206,196"/>
  <polygon points="440,106 452,106 540,196 526,196"/>
  <polygon points="760,106 772,106 860,196 846,196"/>
</g>
<!-- work lamp -->
<rect x="726" y="106" width="8" height="86" fill="#3A3F45"/>
<path d="M690,192 L770,192 L752,224 L708,224 Z" fill="#3A3F45"/>
<ellipse cx="730" cy="224" rx="22" ry="7" fill="#EFE3B8"/>
<g style="mix-blend-mode:multiply"><polygon points="700,226 760,226 856,940 616,940" fill="#D9A521" opacity=".13"/></g>

<!-- floor -->
<rect x="0" y="940" width="900" height="124" fill="#C3BCAC"/>
<rect x="0" y="940" width="900" height="6" fill="#A9A08D"/>

<!-- ================= TRUCK CAB ================= -->
<g>
