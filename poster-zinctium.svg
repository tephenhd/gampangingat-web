  <rect x="256" y="962" width="64" height="72" fill="#16356E"/><rect x="251" y="952" width="74" height="11" fill="#0F2450"/>
  <rect x="270" y="980" width="40" height="30" fill="#E6E3DA" opacity=".85"/>
