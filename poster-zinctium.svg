  <!-- near arm, rolling the panel -->
  <path d="M250,498 L302,524 L350,554" fill="none" stroke="#1E4A96" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="352" cy="556" r="13" fill="#E0DACB"/>
  <!-- freshly rolled panel -->
  <rect x="394" y="482" width="34" height="112" fill="#2E9A5A" opacity=".9"/>
