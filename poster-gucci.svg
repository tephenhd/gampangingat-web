  <text x="52" y="1104" fill="#3FB8C2" font-size="15" letter-spacing="4.6" font-weight="700">THINNER · PENGENCER CAT DUCO &amp; REFINISH</text>
  <text x="49" y="1160" fill="#0E7C86" font-size="60" font-weight="800" letter-spacing="1" opacity=".9">GUCCI</text>
  <text x="52" y="1158" fill="#E6E3DA" font-size="60" font-weight="800" letter-spacing="1">GUCCI</text>
</g>
<g>
