<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-label="Ilustrasi persiapan dan finishing: satu pekerja mendempul panel pintu mobil, satu lagi memoles sisi yang sudah jadi mengkilap">
<defs>
  <pattern id="sm-dot" width="13" height="13" patternUnits="userSpaceOnUse">
    <circle cx="6.5" cy="6.5" r="1.5" fill="#B8862E"/>
  </pattern>
  <filter id="sm-grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
</defs>

<rect width="900" height="1200" fill="#E6E3DA"/>
<rect x="0" y="0" width="900" height="940" fill="#DAD6CA"/>
<rect x="0" y="0" width="252" height="940" fill="url(#sm-dot)" opacity=".22"/>
<g style="mix-blend-mode:multiply">
  <polygon points="0,0 300,0 0,400" fill="#B8862E" opacity=".14"/>
  <polygon points="900,0 900,320 640,0" fill="#1E3358" opacity=".12"/>
</g>

<!-- roof beam + lamp -->
<rect x="0" y="104" width="900" height="10" fill="#B9B3A4"/>
<rect x="446" y="114" width="8" height="80" fill="#3A3F45"/>
<path d="M408,194 L492,194 L474,226 L426,226 Z" fill="#3A3F45"/>
<ellipse cx="450" cy="226" rx="23" ry="7" fill="#EFE3B8"/>
<g style="mix-blend-mode:multiply"><polygon points="418,228 482,228 600,940 300,940" fill="#D9A521" opacity=".12"/></g>

<!-- floor -->
<rect x="0" y="940" width="900" height="124" fill="#C3BCAC"/>
<rect x="0" y="940" width="900" height="6" fill="#A9A08D"/>

