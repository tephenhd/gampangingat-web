<g style="mix-blend-mode:multiply" opacity=".2"><rect width="900" height="1200" filter="url(#sm-grain)"/></g>

<!-- ================= TITLE BAND ================= -->
<rect x="0" y="1064" width="900" height="136" fill="#14181D"/>
<g font-family="NSN, 'Nimbus Sans Narrow', 'Liberation Sans Narrow', 'Arial Narrow', Helvetica, sans-serif">
