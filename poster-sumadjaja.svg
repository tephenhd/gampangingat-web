</g>

<!-- floor tins between the stand legs -->
<g>
  <rect x="376" y="962" width="92" height="60" fill="#8E887A"/>
  <rect x="370" y="951" width="104" height="12" fill="#6B6357"/>
  <rect x="396" y="978" width="52" height="28" fill="#E6E3DA" opacity=".8"/>
