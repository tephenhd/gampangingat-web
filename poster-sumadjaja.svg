  <path d="M602,800 C616,814 642,818 660,810"/>
</g>
<!-- sanding dust -->
<g fill="#8E887A" opacity=".45">
  <circle cx="352" cy="812" r="3.4"/><circle cx="392" cy="828" r="2.6"/><circle cx="322" cy="836" r="3"/>
  <circle cx="424" cy="812" r="2.2"/><circle cx="366" cy="856" r="2.4"/>
