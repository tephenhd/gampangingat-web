  <text x="49" y="1160" fill="#FF5A1F" font-size="60" font-weight="800" letter-spacing="1" opacity=".9">TILOC</text>
  <text x="52" y="1158" fill="#E6E3DA" font-size="60" font-weight="800" letter-spacing="1">TILOC</text>
</g>
<g>
  <rect x="700" y="1120" width="30" height="30" fill="#FF5A1F"/>
  <rect x="736" y="1120" width="30" height="30" fill="#F0243C"/>
  <rect x="772" y="1120" width="30" height="30" fill="#7A4B9E"/>
