<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-label="Ilustrasi bengkel malam: anak muda mengecat helm dengan cat semprot RPM">
<defs>
  <pattern id="rp-dsm" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="1.5" fill="#F2B807"/></pattern>
  <pattern id="rp-dlg" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="3" fill="#F2B807"/></pattern>
  <clipPath id="rp-hel"><circle cx="676" cy="752" r="78"/></clipPath>
  <filter id="rp-grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
</defs>

<rect width="900" height="1200" fill="#14181D"/>
<rect x="0" y="0" width="900" height="940" fill="#1A2027"/>
<rect x="0" y="940" width="900" height="124" fill="#252D35"/>
<rect x="0" y="940" width="900" height="5" fill="#38424C"/>

